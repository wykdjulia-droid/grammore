<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Maze</title>
<style>
:root{--bg:#f6f3ec;--fg:#23201a;--card:#fff;--line:#d9d2c3;--wall:#3b3a4a;--floor:#ebe5d6;--acc:#6d4aff;--good:#1f9d55;--bad:#d64545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--fg:#ece8f5;--card:#201f2b;--line:#34334a;--wall:#0b0b11;--floor:#2a283a;--acc:#9a82ff;--good:#3ecf82;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141c;--fg:#ece8f5;--card:#201f2b;--line:#34334a;--wall:#0b0b11;--floor:#2a283a;--acc:#9a82ff;--good:#3ecf82;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:12px}
#app{width:100%;max-width:520px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--good)}
.bar.m i{background:var(--bad)}
.bar.x i{background:var(--acc)}
#mapw{position:relative}#map{display:grid;grid-template-columns:repeat(11,1fr)}.sp{background-repeat:no-repeat;image-rendering:pixelated}#hero{position:absolute;left:0;top:0;width:9.0909%;aspect-ratio:1;transition:left .2s linear,top .2s linear;transform:scale(1.35);transform-origin:50% 85%;pointer-events:none;z-index:2;display:none}.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.cc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:13px}.pv{width:56px;height:56px}
.t{aspect-ratio:1;background:transparent;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,4.2vw,22px);position:relative}

.t.w::before{content:"";position:absolute;left:0;right:0;top:0;pointer-events:none}
.t.w.fr::before{height:30%;background:rgba(170,140,230,.4);border-bottom:1px solid rgba(10,5,25,.6)}
.t.w.in::before{bottom:0;background:rgba(35,20,75,.5)}
.t.w.fr::after{content:"";position:absolute;left:0;right:0;top:100%;height:40%;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none;z-index:1}
.t b{position:absolute;right:1px;bottom:0;font-size:9px;background:var(--bad);color:#fff;border-radius:4px;padding:0 3px}
.opts{display:grid;gap:8px;margin-top:8px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
button.o{text-align:left;font-weight:600}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row button{padding:6px 10px;font-size:14px}
.sent{font-size:20px;font-weight:700;margin:6px 0}
.msg{min-height:20px;font-size:14px;margin-top:6px}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:8px}

 e.style.display="block";const inst=snap;snap=false;if(inst)e.style.transition="none";

 if(!walking)pose(e,st.ch,face,idleCol())}

function select(){

function bfs(g,sr,sc){const d={},p={},q=[[sr,sc]];d[sr+","+sc]=0;
 for(let i=0;i<q.length;i++){const[r,c]=q[i];for(const[a,e]of[[1,0],[-1,0],[0,1],[0,-1]]){const y=r+a,x=c+e,k=y+","+x;if(y<0||x<0||y>=H||x>=W||g[y][x]==="#"||k in d)continue;d[k]=d[r+","+c]+1;p[k]=r+","+c;q.push([y,x])}}return{d,p}}

 const g=Array.from({length:H},()=>Array(W).fill("#")),f=st.floor;g[5][5]=".";const stk=[[5,5]];
 while(stk.length){const si=Math.random()<.5?stk.length-1:Math.random()*stk.length|0,[r,c]=stk[si];
  const nb=sh([[-2,0],[2,0],[0,-2],[0,2]]).filter(([a,e])=>{const y=r+a,x=c+e;return y>0&&x>0&&y<H-1&&x<W-1&&g[y][x]==="#"});
  if(!nb.length){stk.splice(si,1);continue}
  const[a,e]=nb[0];g[r+a/2][c+e/2]=".";g[r+a][c+e]=".";stk.push([r+a,c+e])}

 const edge=cells.filter(([r,c])=>r===1||c===1||r===H-2||c===W-2).sort((u,v)=>dk(v)-dk(u));

 const ex=([r,c])=>{const o=[];if(r===1)o.push([0,c]);if(r===H-2)o.push([H-1,c]);if(c===1)o.push([r,0]);if(c===W-2)o.push([r,W-1]);return o};
 const A=edge[0],pa=trace(A),sa=new Set(pa);
 const B=edge.slice(1).sort((u,v)=>trace(v).filter(k=>!sa.has(k)).length-trace(u).filter(k=>!sa.has(k)).length)[0];
 const pb=trace(B),sb=new Set(pb),ua=pa.filter(k=>!sb.has(k)),ub=pb.filter(k=>!sa.has(k));
 if(ua.length<3||ub.length<2)return gen();
 for(const E of[A,B]){const[y,x]=sh(ex(E))[0];g[y][x]="X"}
 const pk=(a,t)=>a[Math.min(a.length-1,Math.round(a.length*t))];

 const ps=new Set([...pa,...pb]),nbs=(r,c)=>[[1,0],[-1,0],[0,1],[0,-1]].map(([a,e])=>[r+a,c+e]).filter(([y,x])=>y>=0&&x>=0&&y<H&&x<W&&g[y][x]!=="#");
 const de=cells.filter(([r,c])=>!ps.has(r+","+c)&&nbs(r,c).length===1).sort((u,v)=>dk(v)-dk(u));
 if(de[0]){const[r,c]=de[0];g[r][c]="e"}

function renderMap(){

    const ch=MAP[r][c],k=r+","+c;let s="",cls="t";

  if((ch==="c"||ch==="e")&&!st.done[k]){
    st.done[k]=1;
    if(ch==="c"){st.items.hint+=2;st.items.heal+=1;st.msg="🎁 You found 2 Hint Scrolls and a Heal Potion!"}
    else{st.items.hint+=3;st.items.shield+=2;st.msg="✨ Secret chest! 3 Hint Scrolls and 2 Shields!"}
  }
  if(ch==="X")return nextFloor();
  explore();
}
function battle(r,c){
  const l=monLvl(r,c),mh=10+8*l,tier=l<3?0:l<6?1:2;
  b={r,c,l,boss:BOSS===r+","+c,hp:mh,max:mh,tier,shield:false,hid:[],msg:`A level ${l} ${BOSS===r+","+c?"dragon":"monster"} blocks the way! ${TL} seconds per question.`};
  st.fights++;next();
}
function next(){clearInterval(tm);b.q=getQ(b.tier);b.opts=b.q.o;b.hid=[];b.dl=Date.now()+TL*1000;drawBattle();tm=setInterval(tick,200)}
function tick(){if(!b)return;const ms=b.dl-Date.now();if(ms<=0){clearInterval(tm);return ans(-1)}
 const s=Math.ceil(ms/1000),e=$("#tb");if($("#ts"))$("#ts").textContent=s;if(e){e.style.width=ms/(TL*10)+"%";e.style.background=s<=5?"var(--bad)":""}}
const fmt=s=>{const l=s.split("\n");return l.length>1?`<div>${l[0]}</div><div class="sent">${l.slice(1).join("<br>")}</div>`:`<div class="sent">${s}</div>`};
function drawBattle(){
  renderStats();
  const mon=`<i class="ic2 sm ${b.boss?"i-snake":"i-demon"}"></i>`,ms=Math.max(0,b.dl-Date.now());
  $("#panel").innerHTML=`<div class="stats"><span>${mon} Lv ${b.l}</span><div class="bar m"><i style="width:${Math.max(b.hp,0)/b.max*100}%"></i></div><span>${Math.max(b.hp,0)}/${b.max}</span></div>
  <div class="stats" style="margin-top:6px"><span>⏱️ <b id="ts">${Math.ceil(ms/1000)}</b>s</span><div class="bar x"><i id="tb" style="width:${ms/(TL*10)}%"></i></div></div>
  ${fmt(b.q.s)}
  <div class="opts">${b.opts.map((o,i)=>`<button class="o" ${b.hid.includes(o)?"disabled":""} onclick="ans(${i})">${o}</button>`).join("")}</div>
  <div class="row"><button onclick="useItem('hint')" ${st.items.hint?"":"disabled"}>💡 Hint (${st.items.hint})</button><button onclick="useItem('heal')" ${st.items.heal?"":"disabled"}>🩹 Heal (${st.items.heal})</button><button onclick="useItem('shield')" ${st.items.shield&&!b.shield?"":"disabled"}>🛡️ Shield (${st.items.shield})${b.shield?" ✓":""}</button><button onclick="explore()">🏃 Flee</button></div>
  <div class="msg">${b.msg}</div>`;
}
function useItem(t){
  if(!st.items[t])return;
  if(t==="hint"){const w=b.opts.filter(o=>o!==b.q.c&&!b.hid.includes(o));if(!w.length)return;b.hid.push(w[0]);b.msg="💡 One wrong answer fades away."}
  if(t==="heal"){if(st.hp>=maxHp())return;st.hp=Math.min(maxHp(),st.hp+25);b.msg="🩹 You heal 25 HP."}
  if(t==="shield"){b.shield=true;b.msg="🛡️ Shield up: the next hit is blocked."}
  st.items[t]--;drawBattle();
}
function ans(i){
  clearInterval(tm);st.rounds++;
  if(i>=0&&b.opts[i]===b.q.c){
    const d=6+2*st.lvl+st.bonus;b.hp-=d;b.msg=`✅ Correct! You deal ${d} damage.`;
    if(b.hp<=0)return win();
  }else{
    const d=3+2*b.l,w=i<0?"⏰ Time’s up!":"❌ Wrong!";
    if(b.shield){b.shield=false;b.msg=`${w} Your shield absorbs the ${d} damage.`}
    else{st.hp-=d;b.msg=`${w} It hits you for ${d}. The answer was “${b.q.c}”.`;if(st.hp<=0)return lose()}
  }
  next();
}
function win(){
  const l=b.l,xp=10*l;st.done[b.r+","+b.c]=1;st.kills++;
  let m=`Victory! +${xp} XP.`;
  if(b.boss){st.bonus+=6;st.items.shield+=2;st.items.heal+=2;m+=" The dragon drops the 🗡️ Dragonfang Sword (+6 damage), 2 Shields and 2 Heal Potions!"}
  else{const x=Math.random(),k=x<.5?"hint":x<.8?"heal":"shield";st.items[k]++;m+=` Drop: ${{hint:"💡 Hint Scroll",heal:"🩹 Heal Potion",shield:"🛡️ Shield"}[k]}.`}
  st.xp+=xp;let up=0;
  while(st.xp>=need()){st.xp-=need();st.lvl++;up++}
  if(up){st.hp=maxHp();m+=` ⭐ Level up! You are now level ${st.lvl} and fully healed.`}
  st.msg=m;explore();
}
function lose(){clearInterval(tm);st.deaths++;
  $("#panel").innerHTML=`<h3 style="margin:0 0 6px">💀 You were defeated</h3><div>The monster still lives. You wake up back at the start, fully healed. Level up and come back stronger!</div><div class="row"><button class="p" onclick="respawn()">Try again</button></div>`;
  renderStats();
}
function respawn(){snap=true;st.pos=[5,5];st.hp=maxHp();st.msg="You’re back at the start.";explore()}
addEventListener("keydown",e=>{
  const m={ArrowUp:[-1,0],w:[-1,0],ArrowDown:[1,0],s:[1,0],ArrowLeft:[0,-1],a:[0,-1],ArrowRight:[0,1],d:[0,1]}[e.key];
  if(m){e.preventDefault();mv(...m)}
});
init();explore();
</script></body></html>
